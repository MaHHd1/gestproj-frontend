name: CD - Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Build and replace frontend
        run: |
          docker build -t infra-frontend:latest .
          docker rm -f frontend || true
          docker run -d --name frontend --restart unless-stopped --network infra_infra_net -p 4200:80 infra-frontend:latest
          # Tailscale Funnel serves this second container on localhost:8082.
          # Keep it on the same image so the public Funnel URL cannot drift
          # from the directly exposed frontend service.
          docker rm -f gestproj-funnel-frontend || true
          docker run -d --name gestproj-funnel-frontend --restart unless-stopped --network infra_infra_net -p 127.0.0.1:8082:80 infra-frontend:latest

      - name: Verify frontend service
        run: |
          for i in $(seq 1 20); do
            docker run --rm --network infra_infra_net curlimages/curl:8.10.1 -fsS http://frontend:80/ && exit 0
            sleep 3
          done
          docker logs frontend
          exit 1

      - name: Verify Funnel frontend service
        run: |
          docker exec gestproj-funnel-frontend wget -q -O - http://127.0.0.1/ >/dev/null

      - name: Record deployment success
        if: success()
        run: docker exec postgres psql -U admin -d gestproj -c "INSERT INTO deployments (project_id, status, commit_hash, commit_message, triggered_by, started_at, finished_at, workflow_name, workflow_run_id, deployment_target, docker_status, docker_details) VALUES (1, 'SUCCESS', '${{ github.sha }}', 'Frontend deployed by Gitea Actions', '${{ github.actor }}', NOW(), NOW(), 'CD - Deploy frontend', '${{ github.run_id }}', '100.83.8.6 / frontend', 'HEALTHY', 'Frontend container responded successfully');"

      - name: Record deployment failure
        if: failure()
        run: docker exec postgres psql -U admin -d gestproj -c "INSERT INTO deployments (project_id, status, commit_hash, commit_message, triggered_by, started_at, finished_at, workflow_name, workflow_run_id, deployment_target, docker_status, docker_details) VALUES (1, 'FAILURE', '${{ github.sha }}', 'Frontend deployment failed in Gitea Actions', '${{ github.actor }}', NOW(), NOW(), 'CD - Deploy frontend', '${{ github.run_id }}', '100.83.8.6 / frontend', 'UNHEALTHY', 'Workflow failed before the frontend health check completed');"
