name: CD - Validation du build Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Construire l'image Docker
        run: docker build -t gestproj-frontend:ci-check .

      - name: Confirmer que l'image a ete creee
        run: docker images gestproj-frontend:ci-check
