server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend-funnel:8080/api/;
    proxy_set_header Host $host;
    # The frontend and API share this public origin; avoid forwarding a browser Origin value
    # that belongs to the Tunnel hostname, which is not part of the backend's legacy CORS list.
    proxy_set_header Origin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
